<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Fit Club – Redirecting to App...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fcfbf9;
      color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .badge {
      display: inline-block;
      background: rgba(215, 38, 46, 0.1);
      color: #d7262e;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      font-weight: 800;
      font-style: italic;
      text-transform: uppercase;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: #d7262e;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 24px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #b01b22;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
  <script>
    window.location.href = "http://localhost:3000";
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">Next.js Web Application</div>
    <h1>RS FIT CLUB</h1>
    <p>Redirecting you automatically to the live application on <strong>localhost:3000</strong>...</p>
    <a class="btn" href="http://localhost:3000">Open RS Fit Club App</a>
    <div class="note">
      If redirect doesn't happen automatically, click the button above.
    </div>
  </div>
</body>
</html>
