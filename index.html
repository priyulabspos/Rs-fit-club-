<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Fit Club – Launching Console...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #0d0d0f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .glow-bg {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(215, 38, 46, 0.25) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(60px);
      pointer-events: none;
    }
    .card {
      position: relative;
      background: rgba(23, 23, 26, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    .emblem {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #d7262e 0%, #b01b22 50%, #800e13 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 800;
      font-style: italic;
      color: #fff;
      box-shadow: 0 10px 25px rgba(215, 38, 46, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .badge {
      display: inline-block;
      background: rgba(215, 38, 46, 0.15);
      border: 1px solid rgba(215, 38, 46, 0.3);
      color: #ff4d56;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 14px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 800;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
      line-height: 1.1;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, #d7262e 0%, #b01b22 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 20px -5px rgba(215, 38, 46, 0.4);
      transition: all 0.2s;
    }
    .btn:hover {
      background: linear-gradient(135deg, #e32d36 0%, #be1f27 100%);
      transform: translateY(-1px);
    }
    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
  <script>
    window.location.href = "http://localhost:3000";
  </script>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="card">
    <div class="emblem">RS</div>
    <div class="badge">Next.js Web Engine</div>
    <h1>RS FIT CLUB</h1>
    <p>Connecting to live gym management console at <strong>localhost:3000</strong>...</p>
    <a class="btn" href="http://localhost:3000">
      <span>Open RS Fit Club App</span>
      <span>→</span>
    </a>
    <div class="footer-note">
      Redirecting automatically. Click above if not redirected within 2 seconds.
    </div>
  </div>
</body>
</html>
